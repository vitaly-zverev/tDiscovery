apiVersion: v1
kind: Service
metadata:
  name: discovery-service
spec:
  selector:
    app: discovery-app         # ← Этот selector должен совпадать с labels ваших Pod'ов
  ports:
    - port: 3001
      targetPort: 3001         # ← Порт, который слушает ваш gRPC-сервер внутри контейнера
  clusterIP: 10.109.183.11     # ← Явно заданный IP-адреc (его и укажем при конфигурировании в cluster.discovery.registries.service.endpoint)
  type: ClusterIP              # ← Внутренний IP, доступный только внутри кластера
