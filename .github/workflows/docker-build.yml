name: Build and Publish Docker Images

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build Multi-Platform Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Convert repository name to lowercase
        id: repo_name
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "Repository name: $REPO_NAME"
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.repo_name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "Raw digest: $digest"
          CLEAN_DIGEST=$(echo "$digest" | sed 's/^sha256://')
          echo "Clean digest: $CLEAN_DIGEST"
          PLATFORM_NAME=$(echo "${{ matrix.platform }}" | tr '/' '-')
          echo "$CLEAN_DIGEST" > "/tmp/digests/${PLATFORM_NAME}.txt"
          echo "Content of /tmp/digests:"
          ls -la /tmp/digests/
          cat "/tmp/digests/${PLATFORM_NAME}.txt"
      
      - name: Prepare artifact name
        id: artifact_name
        run: |
          SAFE_NAME=$(echo "${{ matrix.platform }}" | tr '/' '-')
          echo "safe_name=$SAFE_NAME" >> $GITHUB_OUTPUT
          echo "Artifact name: $SAFE_NAME"
      
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.artifact_name.outputs.safe_name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create Multi-Platform Manifest
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    
    steps:
      - name: Convert repository name to lowercase
        id: repo_name
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "Repository name: $REPO_NAME"
      
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.repo_name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      
      - name: Debug - List files
        run: |
          echo "=== Contents of /tmp/digests ==="
          ls -la /tmp/digests/
          echo ""
          echo "=== Contents of each file ==="
          for f in /tmp/digests/*; do
            if [ -f "$f" ]; then
              echo "$f:"
              cat "$f"
              echo ""
            fi
          done
      
      - name: Create and push manifest list
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.repo_name.outputs.repo_name }}"
          
          echo "Image: $IMAGE"
          
          # Build the command arguments
          ARGS=""
          for f in /tmp/digests/*.txt; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              DIGEST=$(cat "$f" | tr -d '\n\r' | xargs)
              if [ -n "$DIGEST" ]; then
                if [[ "$DIGEST" != sha256:* ]]; then
                  ARGS="$ARGS ${IMAGE}@sha256:${DIGEST}"
                else
                  ARGS="$ARGS ${IMAGE}@${DIGEST}"
                fi
                echo "Added digest from $f: $DIGEST"
              fi
            fi
          done
          
          if [ -z "$ARGS" ]; then
            echo "ERROR: No valid digests found!"
            exit 1
          fi
          
          echo "Full arguments: $ARGS"
          
          # Parse tags from JSON
          TAGS=$(echo '${{ steps.meta.outputs.json }}' | jq -r '.tags[]')
          
          # Create manifest for each tag
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "Creating manifest for $tag"
              docker buildx imagetools create -t "$tag" $ARGS
            fi
          done <<< "$TAGS"
      
      - name: Verify manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.repo_name.outputs.repo_name }}"
          
          echo "Verifying manifests:"
          
          # Parse tags from JSON using jq
          echo '${{ steps.meta.outputs.json }}' | jq -r '.tags[]' | while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "Inspecting $tag"
              docker buildx imagetools inspect "$tag" || echo "Failed to inspect $tag"
            fi
          done

  release:
    name: Upload to GitHub Release
    runs-on: ubuntu-latest
    needs:
      - merge
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Convert repository name to lowercase
        id: repo_name
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
      
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Pull and save Docker images
        run: |
          mkdir -p release-images
          IMAGE="${{ env.REGISTRY }}/${{ steps.repo_name.outputs.repo_name }}:${{ steps.version.outputs.version }}"
          
          echo "Pulling $IMAGE"
          docker pull "$IMAGE"
          
          # Save images for each platform
          platforms=("amd64" "arm64")
          for platform in "${platforms[@]}"; do
            echo "Saving linux/$platform image"
            docker pull --platform linux/$platform "$IMAGE"
            docker save "$IMAGE" -o "release-images/tdiscovery-linux-$platform.tar"
          done
      
      - name: Create checksums
        working-directory: release-images
        run: |
          sha256sum *.tar > checksums.txt
          cat checksums.txt
      
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-images/*.tar
            release-images/checksums.txt
          generate_release_notes: true
          name: Release ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}